<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppFramework 平台管理台</title>
    <script>
      // 首屏防白闪：React 挂载前先按存储的模式定下 color-scheme，
      // global.css 的 Canvas 兜底色在深色模式下就是暗的；精确色值随后由 token 投影覆盖。
      try {
        var stored = JSON.parse(localStorage.getItem('appframework.theme') || '{}');
        document.documentElement.style.colorScheme =
          stored.mode === 'dark' || stored.mode === 'deepdark' ? 'dark' : 'light';
      } catch {
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# 平台服务端最小可运行栈：PostgreSQL + Platform.Api
#
# 用法：
#   cp deploy/env.example deploy/.env   # 改掉 POSTGRES_PASSWORD 与 JWT_SIGNING_KEY
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   curl http://localhost:8080/healthz
#   curl http://localhost:8080/ready
name: appframework-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appframework_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 里必须设置 POSTGRES_PASSWORD}
      # 中文排序与大小写行为在 initdb 时定死，避免后续迁移踩 locale 差异
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-appframework_platform}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Platform: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-appframework_platform};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-appframework-platform}
      Jwt__Audience: ${JWT_AUDIENCE:-appframework}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?deploy/.env 里必须设置 JWT_SIGNING_KEY（≥32 字符）}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      Jwt__AllowDevTokenEndpoint: ${JWT_ALLOW_DEV_TOKEN_ENDPOINT:-false}
      # 首个管理员口令：留空则跳过管理员创建（内置角色与演示应用仍会就绪）；
      # 首次登录会被强制改密，改完全部会话作废，所以这里只用于引导。
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # 授权签发私钥（ECDSA P-256 PKCS#8 DER 的 Base64）：留空即 unmanaged，客户端不采信任何授权。
      Licensing__SigningKeyPkcs8: ${LICENSING_SIGNING_KEY_PKCS8:-}
      # 指标端点：默认开且匿名可抓，只暴露聚合运行指标。公网可达时务必设 scrape token，
      # 或直接在边缘把 /metrics 限制在内网。
      Metrics__Enabled: ${METRICS_ENABLED:-true}
      Metrics__ScrapeToken: ${METRICS_SCRAPE_TOKEN:-}
      # Webhook 投递器：多副本部署时只让一个副本开着，避免同一事件被并发重复投递。
      Webhooks__DispatcherEnabled: ${WEBHOOKS_DISPATCHER_ENABLED:-true}
      BlobStorage__RootPath: /data/blobs
      # 反向代理后取真实客户端 IP 与协议（限流按 IP 分区，不能拿到代理 IP）
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - blobs:/data/blobs
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
  blobs:
